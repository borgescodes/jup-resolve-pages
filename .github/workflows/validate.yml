name: Validate static demos
on:
  pull_request:
  push:
    branches: [main, release/clean-snapshot]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            service-desk/package-lock.json
      - run: npm ci
      - run: npm ci --prefix service-desk
      - run: mkdir -p artifacts
      - run: npm run lint
      - name: Test suite (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          npm test | tee artifacts/tests.log
      - run: npm run build
      - name: Privacy audit (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:privacy | tee artifacts/privacy.log
      - name: Gitleaks tree, build and all new history
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks/archive.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks/archive.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks/archive.tar.gz" -C "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact --log-opts="--all" --report-format json --report-path artifacts/gitleaks-history.json
          "$RUNNER_TEMP/gitleaks/gitleaks" dir . --redact --report-format json --report-path artifacts/gitleaks-tree.json
          "$RUNNER_TEMP/gitleaks/gitleaks" dir dist --redact --report-format json --report-path artifacts/gitleaks-build.json
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
      - name: Stamp evidence with exact reviewed revision
        run: node scripts/release-evidence.mjs
        env:
          REVIEW_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-evidence
          path: artifacts/
  deploy:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.PUBLICATION_AUTHORIZED == 'true'
    runs-on: ubuntu-latest
    environment: github-pages
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm ci --prefix service-desk
      - run: npm run build
      - name: Pre-deploy privacy audit (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npm run audit:privacy | tee artifacts/privacy.log
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
